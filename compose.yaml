services:
  mtg-util:
    # latest follows stable releases; set MTG_IMAGE to pin a version or digest.
    image: ${MTG_IMAGE:-ghcr.io/addison16/commandtable:latest}
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
      ROOM_TTL_DAYS: ${ROOM_TTL_DAYS:-30}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-90}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-512}
      MAX_ROOM_CONNECTIONS: ${MAX_ROOM_CONNECTIONS:-64}
      ROOM_RECEIPT_LIMIT: ${ROOM_RECEIPT_LIMIT:-20000}
      RETRY_REVISION_WINDOW: ${RETRY_REVISION_WINDOW:-10000}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - mtg-util-data:/data
    init: true
    restart: unless-stopped
volumes:
  mtg-util-data:
